name: One-time draft credit replay migration scaffold
on:
  push:
    branches: ['fix/ai-billing-lifecycle-safety-2026-11']
    paths:
      - '.github/workflows/one-time-create-credit-replay-migration.yml'
permissions:
  contents: write
jobs:
  new-migration:
    if: github.repository == 'tolulopemakinde/careerdevglobal' && github.ref == 'refs/heads/fix/ai-billing-lifecycle-safety-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pinned Supabase CLI v2
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Confirm CLI command and generate empty migration locally
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help >/dev/null
          supabase migration new bind_ai_credit_replay_to_execution
          file=$(find supabase/migrations -maxdepth 1 -type f -name '*_bind_ai_credit_replay_to_execution.sql' | sort | tail -1)
          test -n "$file"
          test -f "$file"
          git add "$file"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai-billing): scaffold additive credit replay migration with Supabase CLI"
          git push origin HEAD:refs/heads/fix/ai-billing-lifecycle-safety-2026-11
