name: LinkedIn intake evidence validation

on:
  push:
    branches:
      - fix/linkedin-intake-document-evidence
  pull_request:
    branches:
      - feature/linkedin-optimization-adaptive-intake
    paths:
      - "supabase/functions/careerdev-intake-engine-v2/**"
      - "scripts/validate-linkedin-intake-evidence.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/linkedin-intake-evidence-validation.yml"

permissions:
  contents: read

concurrency:
  group: linkedin-intake-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run LinkedIn intake evidence static validation
        run: npm run validate:linkedin-intake-evidence

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        run: deno check --no-config supabase/functions/careerdev-intake-engine-v2/index.ts
