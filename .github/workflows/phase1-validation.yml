name: Phase 1 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'phase-*']

permissions:
  contents: read

concurrency:
  group: phase1-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, types, inputs, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SENTRY_SILENT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run source-secret audit
        run: npm run audit:source

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Test structured pilot execution and billing guards
        run: node --test tests/pilot.test.mjs tests/pilot-runtime.test.mjs tests/pilot-provider-boundaries.test.mjs

      - name: Verify packaged build inputs
        run: npm run check:build-inputs

      - name: Validate Phase 2 AI boundaries
        run: npm run validate:phase2-boundaries

      - name: Validate Edge security module
        run: npm run validate:edge-security

      - name: Validate Phase 3 preview controls
        run: npm run validate:phase3-preview

      - name: Validate Phase 4 concurrency simulation
        run: npm run validate:phase4-simulation

      - name: Check whitespace errors
        run: git diff --check

      - name: Build application
        run: npm run build
