name: AI billing regression guards
on:
  pull_request:
    paths:
      - 'supabase/functions/careerdev-paystack-webhook/**'
      - 'supabase/functions/careerdev-ai-subscription-manage/**'
      - 'supabase/functions/careerdev-ai-subscription-checkout/**'
      - 'supabase/functions/careerdev-ai-subscription-verify/**'
      - 'supabase/functions/careerdev-ai-billing-reconcile/**'
      - 'supabase/functions/careerdev-ai-payment-adjustment/**'
      - 'supabase/functions/careerdev-ai-agent-runtime/**'
      - 'supabase/functions/_shared/ai-billing-*'
      - 'supabase/functions/_shared/ai-payment-*'
      - 'supabase/migrations/**'
      - 'lib/ai-billing-plans.ts'
      - 'lib/ai-billing-lifecycle.mjs'
      - 'tests/ai-*'
      - 'package.json'
      - '.github/workflows/ai-billing-tests.yml'
  push:
    branches: ['fix/ai-billing-lifecycle-safety-2026-11']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AI billing unit and source regression tests
        run: npm run test:ai-billing
